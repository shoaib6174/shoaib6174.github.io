          - generic [ref=f10e33]:
            - heading "A book on C, at 16" [level=3] [ref=f10e34]
            - paragraph [ref=f10e36]: I grew up in a small town and had seen only a few computers before I had my own. A few months after getting it, I decided programmers were cool and I wanted to be one. I downloaded a book on C over a slow connection and worked through it end to end.
            - generic [ref=f10e37]:
              - term [ref=f10e38]: Started by
              - definition [ref=f10e39]: A downloaded book on C
              - term [ref=f10e40]: Chose
              - definition [ref=f10e41]: To learn programming a few months after getting my first computer.
              - term [ref=f10e42]: Result
              - definition [ref=f10e43]: Worked through the whole book. Then the board exams took over and it stopped.
        - article [ref=f10e44]:
          - time [ref=f10e46]: "2017"
          - generic [ref=f10e47]:
            - heading "Textile Engineering at BUTEX, majoring in Industrial and Production Engineering" [level=3] [ref=f10e48]
            - generic [ref=f10e49]:
              - paragraph [ref=f10e50]: "Every term mixed two kinds of courses. One half was engineering: programming, electrical, mechanical, automation and control, instrumentation, product design, SolidWorks and CATIA, operations research, simulation. The other half was textiles. I liked the first half."
              - paragraph [ref=f10e51]:
                - text: In first year I read
                - emphasis [ref=f10e52]: Life 3.0
                - text: . That is where the interest in AI started.
            - generic [ref=f10e53]:
              - term [ref=f10e54]: Chose
              - definition [ref=f10e55]: The IPE track at Bangladesh University of Textiles, for its mechanical, electrical, automation, and product design courses.
              - term [ref=f10e56]: Ruled out
              - definition [ref=f10e57]: The textile half of the degree. Yarn, fabric, wet processing, apparel. Not the engineering I had wanted.
              - term [ref=f10e58]: Result
              - definition [ref=f10e59]: Graduated in 2022. Tried JavaScript, Java, C++, and competitive programming along the way, then CS50 after reading Life 3.0. None of it held yet.
        - article [ref=f10e60]:
          - time [ref=f10e62]: "2017"
          - generic [ref=f10e63]:
            - heading [level=3] [ref=f10e64]:
              - link "Debate, and the BUTEX Business Club" [ref=f10e65] [cursor=pointer]:
                - /url: /route/2017-debate-and-club/
            - paragraph [ref=f10e67]: The debate team and the Business Club were where I learned to put an argument together and to run things with other people. TEXBIZ was the club’s first national-level competition and the first time I had organised something that size.
            - generic [ref=f10e68]:
              - term [ref=f10e69]: Chose
              - definition [ref=f10e70]: Class representative in first year. Joined the Business Club the year it was founded.
              - term [ref=f10e71]: Result
              - definition [ref=f10e72]: Runner-up in the intra-university debate championship with a three-person team, best speaker in two rounds. Helped organise TEXBIZ, the university's first national competition. Vice president of the club by 2021.
