                - /url: /route/2021-certifications-and-ml/
            - paragraph [ref=f10e151]: Microsoft Learn Student Ambassador from 2021, and IBM Z Ambassador for a term the same year. The ambassador program came with an exam voucher. I spent it on data analytics, the skill closest to the supply chain work I was studying. Machine learning followed from Andrew Ng’s course and a lot of YouTube, then the Data Scientist exam. I wrote up each one as I went, which became a habit.
            - generic [ref=f10e152]:
              - term [ref=f10e153]: Chose
              - definition [ref=f10e154]: Microsoft's Data Analyst Associate exam, on a voucher from the Student Ambassador program, because it fit supply chain work. Then Andrew Ng's course, and the Azure Data Scientist Associate exam.
              - term [ref=f10e155]: Result
              - definition [ref=f10e156]: "First formal machine learning. First articles: how I passed each exam, and a Flask app that reads text from images with Azure's vision API."
