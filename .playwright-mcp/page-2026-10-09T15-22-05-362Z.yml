        - article [ref=f10e129]:
          - time [ref=f10e131]: "2020"
          - generic [ref=f10e132]:
            - heading "A bootcamp, a MicroMasters, two tracks ruled out" [level=3] [ref=f10e133]
            - generic [ref=f10e134]:
              - paragraph [ref=f10e135]: Early 2020. I decided that this time I would take it seriously. The bootcamp was run by an IPE graduate who had switched to software. I finished it. I did not enjoy frontend work, and I had gaps in computer science basics. Google’s IT Support certificate filled some of the gaps. I took the cloud specialisation because DevOps was in demand. Finishing it told me DevOps was not for me either.
              - paragraph [ref=f10e136]: The MicroMasters mattered most. Five courses over more than a year gave me the mathematics I had never had. One lecture in the fifth course pointed me at machine learning.
            - generic [ref=f10e137]:
              - term [ref=f10e138]: Chose
              - definition [ref=f10e139]: To treat learning to code as the main thing. A web development bootcamp with Programming Hero, and the MITx MicroMasters in Supply Chain Management.
              - term [ref=f10e140]: Ruled out
              - definition [ref=f10e141]: Frontend work, after finishing the bootcamp. DevOps, after the Architecting with Google Compute Engine specialisation.
              - term [ref=f10e142]: Result
              - definition [ref=f10e143]: The MicroMasters took over a year and gave me the probability and statistics I needed for machine learning. Its fifth course had a lecture on machine learning in supply chains. This time I had the prerequisites.
        - article [ref=f10e144]:
