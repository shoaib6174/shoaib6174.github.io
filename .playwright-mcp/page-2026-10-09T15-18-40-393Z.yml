        - heading "LLM robot task planner" [level=1] [ref=f7e23]
        - paragraph [ref=f7e24]: A language model plans and executes multi-step tasks for a mobile robot with an arm, in simulation.
      - figure "LLM robot task planner" [ref=f7e25]:
        - generic [ref=f7e26]: "Demo: the robot fetching the red cube from room A to room B"
      - paragraph [ref=f7e28]: "I wanted to see how far a local language model could go as the planner for a real robot stack. The answer so far: it can decompose a request, call navigation, perception, and manipulation as tools, and replan when a step fails."
      - generic [ref=f7e29]:
        - paragraph [ref=f7e30]: Give it “bring the red cube from room A to room B”. The agent navigates to room A with Nav2, finds the cube with YOLO, picks it up, drives to room B, and places it. If the cube is not where it expected, it searches the other room and replans.
        - paragraph [ref=f7e31]: Four of five demo scenarios pass. The one that does not, moving all cubes at once, fails on localisation drift after repeated rotation scans. That is a known AMCL limitation and the next thing to fix.
        - paragraph [ref=f7e32]: The same software and agent architecture is the base for the factory security robot concept. Phase 2 is the physical JetRover.
      - paragraph [ref=f7e33]: Stack ROS 2, Nav2, YOLO, Gazebo, LangChain, Qwen2.5 via Ollama, JetRover
