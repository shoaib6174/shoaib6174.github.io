              - /url: /work/llm-robot-task-planner/
          - paragraph [ref=f2e36]: A language model plans and executes multi-step tasks for a mobile robot with an arm, in simulation.
          - paragraph [ref=f2e37]: "I wanted to see how far a local language model could go as the planner for a real robot stack. The answer so far: it can decompose a request, call navigation, perception, and manipulation as tools, and replan when a step fails."
