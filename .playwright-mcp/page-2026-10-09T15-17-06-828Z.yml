              - /url: /work/vlm-perception-edge/
          - paragraph [ref=f2e48]: Perception and decision pipelines built on vision-language and vision-language-action models, deployed on edge devices.
          - paragraph [ref=f2e49]: Most of the recent robotics results I read use vision-language models for perception and VLA models for control. The lab's robots run on Jetson boards, so the work is getting those models to run where the robot is, within its power budget.
