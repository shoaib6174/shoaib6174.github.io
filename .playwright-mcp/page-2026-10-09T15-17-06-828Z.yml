          - heading [level=3] [ref=f2e58]:
            - link "Multi-agent pursuit-evasion with reinforcement learning" [ref=f2e59] [cursor=pointer]:
              - /url: /work/safe-rl-pe/
          - paragraph [ref=f2e60]: Adversarial self-play for one-on-one pursuit-evasion under partial observability, with the mechanisms that keep it from collapsing.
          - paragraph [ref=f2e61]: Standard self-play collapses when the agents cannot see each other. We wanted to know which ingredients keep both policies improving, and whether the result is an equilibrium or only looks like one.
