        - article [ref=f1e129]:
          - time [ref=f1e131]: "2020"
          - generic [ref=f1e132]:
            - heading "A bootcamp, a MicroMasters, two tracks ruled out" [level=3] [ref=f1e133]
            - generic [ref=f1e134]:
              - paragraph [ref=f1e135]: Early 2020. I decided that this time I would take it seriously. The bootcamp was run by an IPE graduate who had switched to software. I finished it. I did not enjoy frontend work, and I had gaps in computer science basics. Google’s IT Support certificate filled some of the gaps. I took the cloud specialisation because DevOps was in demand. Finishing it told me DevOps was not for me either.
              - paragraph [ref=f1e136]: The MicroMasters mattered most. Five courses over more than a year gave me the mathematics I had never had. One lecture in the fifth course pointed it at machine learning.
            - generic [ref=f1e137]:
              - term [ref=f1e138]: Chose
              - definition [ref=f1e139]: To treat learning to code as the main thing. A web development bootcamp with Programming Hero, and the MITx MicroMasters in Supply Chain Management.
              - term [ref=f1e140]: Ruled out
              - definition [ref=f1e141]: Frontend work, after finishing the bootcamp. DevOps, after the Architecting with Google Compute Engine specialisation.
              - term [ref=f1e142]: Result
              - definition [ref=f1e143]: The MicroMasters took over a year and gave me the probability and statistics I needed for machine learning. Its fifth course had a lecture on machine learning in supply chains. This time I had the prerequisites.
