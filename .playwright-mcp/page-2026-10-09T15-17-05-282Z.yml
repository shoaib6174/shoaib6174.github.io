            - heading "A book on C, at 16" [level=3] [ref=f1e34]
            - paragraph [ref=f1e36]: I grew up in a small town and had seen only a few computers before I had my own. A few months after getting it, I decided programmers were cool and I wanted to be one. I downloaded a book on C over a slow connection and worked through it end to end.
            - generic [ref=f1e37]:
              - term [ref=f1e38]: Started by
              - definition [ref=f1e39]: A downloaded book on C
              - term [ref=f1e40]: Chose
              - definition [ref=f1e41]: To learn programming a few months after getting my first computer.
              - term [ref=f1e42]: Result
              - definition [ref=f1e43]: Worked through the whole book. Then the board exams took over and it stopped.
        - article [ref=f1e44]:
          - time [ref=f1e46]: "2017"
          - generic [ref=f1e47]:
            - heading "Textile Engineering at BUTEX, majoring in Industrial and Production Engineering" [level=3] [ref=f1e48]
            - generic [ref=f1e49]:
              - paragraph [ref=f1e50]: "Every term mixed two kinds of courses. One half was engineering: programming, electrical, mechanical, automation and control, instrumentation, product design, SolidWorks and CATIA, operations research, simulation. The other half was textiles. I liked the first half."
              - paragraph [ref=f1e51]:
                - text: In first year I read
                - emphasis [ref=f1e52]: Life 3.0
                - text: . That is where the interest in AI started.
            - generic [ref=f1e53]:
              - term [ref=f1e54]: Chose
              - definition [ref=f1e55]: The IPE track at Bangladesh University of Textiles, for its mechanical, electrical, automation, and product design courses.
              - term [ref=f1e56]: Ruled out
              - definition [ref=f1e57]: The textile half of the degree. Yarn, fabric, wet processing, apparel. Not the engineering I had wanted.
              - term [ref=f1e58]: Result
              - definition [ref=f1e59]: Graduated in 2022. Tried JavaScript, Java, C++, and competitive programming along the way, then CS50 after reading Life 3.0. None of it held yet.
        - article [ref=f1e60]:
