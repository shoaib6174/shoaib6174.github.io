            - paragraph [ref=f1e67]: The debate team and the Business Club were where I learned to put an argument together and to run things with other people. TEXBIZ was the club’s first national-level competition and the first time I had organised something that size.
            - generic [ref=f1e68]:
              - term [ref=f1e69]: Chose
              - definition [ref=f1e70]: Class representative in first year. Joined the Business Club the year it was founded.
              - term [ref=f1e71]: Result
              - definition [ref=f1e72]: Runner-up in the intra-university debate championship with a three-person team, best speaker in two rounds. Helped organise TEXBIZ, the university's first national competition. Vice president of the club by 2021.
