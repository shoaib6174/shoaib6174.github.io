          - generic [ref=f3e135]:
            - heading [level=3] [ref=f3e136]:
              - link "Fashion trend research platform" [ref=f3e137] [cursor=pointer]:
                - /url: /work/nitex-trend-platform/
            - paragraph [ref=f3e138]: Ingests Instagram photos, tags clothing categories and attributes with a locally deployed vision-language model, and turns tag frequencies into trend signals over time.
            - paragraph [ref=f3e139]: NITEX wanted trend signals from what people were actually wearing in photos. The hard part was running a vision-language model locally at the volume the pipeline needed, and turning raw tags into something a merchandiser could read.
