            - paragraph [ref=f3e150]: "An AI chatbot and voice-agent platform: document chat with citations, phone agents over Twilio and Vapi, and one inbox across WhatsApp, Telegram, web, and Zapier."
            - paragraph [ref=f3e151]: "Small businesses kept asking FenloAI for the same things: answer questions from our documents, answer the phone, and do it on every channel we use. BotForge puts them on one backend."
