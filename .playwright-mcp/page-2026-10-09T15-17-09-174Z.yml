    - region [ref=f3e45]:
      - img "Mohammad Shoaib"
      - heading "Mohammad Shoaib" [level=1] [ref=f3e46]
      - paragraph [ref=f3e47]: Research assistant at NSU Intelligent Robotics Lab, where I put language and vision-language models on robots. Co-founder of FenloAI, where we build AI systems for small businesses on contract.
      - paragraph [ref=f3e48]: Robots are where an AI system has to work end to end in the physical world, and that is what I wanted to build before university. Four math books for school students and twenty-one technical articles along the way. Dhaka, Bangladesh.
    - region [ref=f3e49]:
      - heading "Now" [level=2] [ref=f3e50]
      - list [ref=f3e51]:
        - listitem [ref=f3e52]: "LLM robot task planner: four of its five demo scenarios pass in simulation. Next, the physical JetRover."
        - listitem [ref=f3e53]: Vision-language and vision-language-action models on the lab's Jetson boards.
        - listitem [ref=f3e54]: "Pursuit-evasion with reinforcement learning: paper in preparation for CoRL 2026."
        - listitem [ref=f3e55]: "NSU AI SAT: the CubeSat's AI payload goes to engineering model next."
        - listitem [ref=f3e56]: "Learning: Chinese toward HSK 2, optimal control, SLAM."
    - region [ref=f3e57]:
      - heading "What I do" [level=2] [ref=f3e58]
      - generic [ref=f3e59]:
        - generic [ref=f3e60]:
          - heading "I build systems." [level=3] [ref=f3e61]
          - paragraph [ref=f3e62]: Robot stacks, perception on the boards the robots carry, two data platforms for a fashion company, products for clients. I prefer building to theory, and found that out by doing a semester of quantum research.
        - generic [ref=f3e63]:
          - heading "I write down what I learn." [level=3] [ref=f3e64]
          - paragraph [ref=f3e65]: A math book for classes 8 to 12 and a three-volume olympiad series for classes 2 to 7. Twenty-one articles, most written in the week after I learned the thing. A semester as a teaching assistant in computer architecture.
        - generic [ref=f3e66]:
          - heading "I bring people together." [level=3] [ref=f3e67]
          - paragraph [ref=f3e68]: A company I co-founded, and a Qiskit Advocate role since 2023. Before that, a university business club from its first year to vice president, a national competition, and campus teams across fifty universities.
