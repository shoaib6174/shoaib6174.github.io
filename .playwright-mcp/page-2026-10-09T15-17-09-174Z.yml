          - generic [ref=f3e109]:
            - heading [level=3] [ref=f3e110]:
              - link "Vision-language models on robot hardware" [ref=f3e111] [cursor=pointer]:
                - /url: /work/vlm-perception-edge/
            - paragraph [ref=f3e112]: Perception and decision pipelines built on vision-language and vision-language-action models, deployed on edge devices.
            - paragraph [ref=f3e113]: Most of the recent robotics results I read use vision-language models for perception and VLA models for control. The lab's robots run on Jetson boards, so the work is getting those models to run where the robot is, within its power budget.
            - generic [ref=f3e114]:
              - generic [ref=f3e115]: In progress
