          - generic [ref=f3e121]:
            - heading [level=3] [ref=f3e122]:
              - link "Multi-agent pursuit-evasion with reinforcement learning" [ref=f3e123] [cursor=pointer]:
                - /url: /work/safe-rl-pe/
            - paragraph [ref=f3e124]: Adversarial self-play for one-on-one pursuit-evasion under partial observability, with the mechanisms that keep it from collapsing.
            - paragraph [ref=f3e125]: Standard self-play collapses when the agents cannot see each other. We wanted to know which ingredients keep both policies improving, and whether the result is an equilibrium or only looks like one.
            - generic [ref=f3e126]:
              - generic [ref=f3e127]: Paper in preparation
